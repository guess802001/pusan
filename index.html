<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>모바일 부고장 작성기</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Html2Canvas for downloading preview as image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #f3f4f6;
        }
        .font-serif-kr {
            font-family: 'Noto Serif KR', serif;
        }
        /* Custom Scrollbar for form panel */
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="text-gray-800 antialiased min-h-screen flex flex-col justify-between">

    <!-- Header -->
    <header class="bg-slate-900 text-white p-4 shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <i data-lucide="flower-2" class="w-6 h-6 text-amber-200"></i>
                <h1 class="text-xl font-bold font-serif-kr tracking-wide">스마트 모바일 부고장 생성기</h1>
            </div>
            <button onclick="downloadPreview()" class="bg-amber-600 hover:bg-amber-700 text-white text-xs md:text-sm px-3 py-1.5 rounded-lg flex items-center gap-1.5 transition shadow">
                <i data-lucide="download" class="w-4 h-4"></i>
                <span>부고장 이미지 저장</span>
            </button>
        </div>
    </header>

    <!-- Main Content Container -->
    <main class="max-w-7xl mx-auto w-full p-4 md:p-6 flex-1 grid grid-cols-1 lg:grid-cols-12 gap-6">
        
        <!-- Left: Input Form Panel -->
        <section class="lg:col-span-6 bg-white p-6 rounded-2xl shadow-sm border border-gray-200 flex flex-col justify-between max-h-[85vh] overflow-y-auto">
            <div>
                <h2 class="text-lg font-bold text-slate-800 mb-4 pb-2 border-b border-gray-100 flex items-center gap-2">
                    <i data-lucide="edit-3" class="w-5 h-5 text-amber-600"></i>
                    부고 정보 입력
                </h2>

                <form id="bugoForm" class="space-y-4 text-sm">
                    <!-- 장례식장 명 -->
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">장례식장명 (상단 헤더)</label>
                        <input type="text" id="inputHallName" value="테스트장례식장" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>

                    <div class="grid grid-cols-3 gap-3">
                        <!-- 고인 이름 -->
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">고인 성함</label>
                            <input type="text" id="inputDeceasedName" value="김고인" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <!-- 나이 -->
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">향년 (세)</label>
                            <input type="number" id="inputAge" value="100" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <!-- 성별 -->
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">성별</label>
                            <select id="inputGender" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                                <option value="남" selected>남</option>
                                <option value="여">여</option>
                            </select>
                        </div>
                    </div>

                    <!-- 영정 사진 업로드 -->
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">영정 사진 변경</label>
                        <input type="file" id="inputPhoto" accept="image/*" class="w-full text-xs text-slate-500 file:mr-3 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 cursor-pointer">
                    </div>

                    <!-- 상주 및 유족 정보 -->
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">상주 / 유족 정보</label>
                        <input type="text" id="inputMourner" value="상주 홍길동" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none" placeholder="예: 상주 홍길동 / 아들 홍길순">
                    </div>

                    <!-- 발인 일시 및 시간 -->
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">발인 일자</label>
                            <input type="date" id="inputBalinDate" value="2027-12-31" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                        <div>
                            <label class="block font-medium text-gray-700 mb-1">발인 시간</label>
                            <input type="time" id="inputBalinTime" value="08:10" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                        </div>
                    </div>

                    <!-- 부의 계좌 정보 -->
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">부의금 계좌 정보</label>
                        <input type="text" id="inputAccount" value="신한은행 110-123-456789 (예금주: 홍길동)" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>

                    <!-- 하단 공지 안내 문구 -->
                    <div>
                        <label class="block font-medium text-gray-700 mb-1">하단 공지 배너 문구</label>
                        <input type="text" id="inputNotice" value="본 빈소는 스마트화환만 받습니다" class="w-full p-2.5 border rounded-lg focus:ring-2 focus:ring-amber-500 focus:outline-none">
                    </div>
                </form>
            </div>

            <!-- 메시지 송출 / 공유 버튼 구역 -->
            <div class="mt-6 pt-4 border-t border-gray-100 grid grid-cols-2 gap-3">
                <button onclick="shareKakao()" class="w-full bg-yellow-400 hover:bg-yellow-500 text-amber-950 font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-sm text-xs md:text-sm transition">
                    <i data-lucide="message-circle" class="w-4 h-4"></i>
                    카카오톡 부고 송출
                </button>
                <button onclick="copySMS()" class="w-full bg-slate-800 hover:bg-slate-900 text-white font-bold py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-sm text-xs md:text-sm transition">
                    <i data-lucide="share-2" class="w-4 h-4"></i>
                    문자 메시지 복사
                </button>
            </div>
        </section>

        <!-- Right: Real-time Mobile Preview Panel -->
        <section class="lg:col-span-6 flex flex-col items-center justify-start">
            <div class="text-xs font-semibold text-slate-500 uppercase tracking-wider mb-2 flex items-center gap-1">
                <i data-lucide="smartphone" class="w-4 h-4"></i> 실시간 모바일 프리뷰
            </div>

            <!-- Smartphone Frame Mockup -->
            <div class="w-full max-w-[390px] bg-black rounded-[40px] p-3 shadow-2xl border-4 border-slate-800 relative">
                <!-- Speaker/Camera Notch -->
                <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-5 bg-black rounded-b-xl z-30 flex items-center justify-center">
                    <div class="w-12 h-1 bg-slate-800 rounded-full"></div>
                </div>

                <!-- Screen Content Area (Scrollable inside phone) -->
                <div id="mobilePreview" class="w-full bg-[#f6f3eb] rounded-[30px] overflow-hidden min-h-[660px] flex flex-col justify-between text-slate-800 relative select-none">
                    
                    <!-- 1. Top Navy Header -->
                    <div class="bg-[#1a2536] text-white py-3 px-4 text-center font-serif-kr text-base font-semibold tracking-wide shadow-md z-10 pt-6">
                        <span id="previewHallName">테스트장례식장</span>
                    </div>

                    <!-- 2. Main Floral Banner with Portrait Frame -->
                    <div class="relative bg-[#d1c2a5] py-6 px-4 flex flex-col items-center justify-center overflow-hidden border-b border-amber-900/10">
                        <!-- Floral Background SVG -->
                        <svg class="absolute inset-0 w-full h-full object-cover opacity-35 pointer-events-none" viewBox="0 0 400 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <circle cx="50" cy="180" r="80" fill="#ffffff"/>
                            <circle cx="350" cy="180" r="80" fill="#ffffff"/>
                            <path d="M10 120 C 60 90, 100 150, 150 110" stroke="#5a6b48" stroke-width="8" stroke-linecap="round"/>
                            <path d="M390 120 C 340 90, 300 150, 250 110" stroke="#5a6b48" stroke-width="8" stroke-linecap="round"/>
                        </svg>

                        <!-- Memorial Portrait Frame -->
                        <div class="relative z-10 my-1">
                            <div class="relative w-36 h-48 bg-slate-900 p-1.5 rounded border-2 border-stone-600 shadow-2xl flex flex-col items-center justify-center">
                                <!-- Black Ribbon -->
                                <div class="absolute -top-1 -left-1 w-12 h-12 z-20 pointer-events-none">
                                    <div class="w-10 h-2 bg-black transform -rotate-45 translate-y-3 -translate-x-2 shadow"></div>
                                </div>
                                <div class="absolute -top-1 -right-1 w-12 h-12 z-20 pointer-events-none">
                                    <div class="w-10 h-2 bg-black transform rotate-45 translate-y-3 translate-x-2 shadow"></div>
                                </div>
                                <!-- Chrysanthemum Icon on Frame Top -->
                                <div class="absolute -top-3 bg-stone-800 text-amber-200 rounded-full p-0.5 border border-amber-400/40 z-20">
                                    <i data-lucide="flower-2" class="w-4 h-4"></i>
                                </div>

                                <!-- Photo Area -->
                                <div class="w-full h-full bg-slate-200 overflow-hidden rounded-sm flex items-center justify-center">
                                    <img id="previewPhoto" src="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=300" alt="영정사진" class="w-full h-full object-cover">
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 3. Deceased Info Section -->
                    <div class="py-4 text-center bg-[#f6f3eb] px-4">
                        <h3 class="text-xl font-bold font-serif-kr text-slate-900 tracking-tight">
                            故 <span id="previewDeceasedName">김고인</span> (<span id="previewAge">100</span> 세 / <span id="previewGender">남</span>)
                        </h3>
                        <p class="text-xs text-slate-600 mt-1 font-serif-kr tracking-widest">별세</p>
                    </div>

                    <div class="px-5 my-1">
                        <hr class="border-t border-slate-300">
                    </div>

                    <!-- 4. Mourner & Funeral Date Info -->
                    <div class="px-6 py-3 space-y-3 font-serif-kr text-slate-800 flex-1">
                        <!-- Sangju Info -->
                        <div class="flex items-start gap-2">
                            <i data-lucide="flower-2" class="w-4 h-4 text-slate-600 mt-0.5 shrink-0"></i>
                            <div>
                                <span class="font-semibold text-sm">상주</span>
                                <p id="previewMourner" class="text-sm font-sans font-medium text-slate-900 mt-0.5">상주 홍길동</p>
                            </div>
                        </div>

                        <!-- Balin Date & Countdown -->
                        <div class="pt-2 border-t border-slate-200/60">
                            <div class="text-xs text-slate-500">발인일</div>
                            <div id="previewBalinFull" class="text-sm font-semibold font-sans text-slate-900 mt-0.5">
                                2027년 12월 31일(금) 08시 10분
                            </div>
                            <div id="previewDday" class="text-xs font-sans text-rose-600 font-medium mt-1">
                                발인까지 473일 남았습니다
                            </div>
                        </div>
                    </div>

                    <!-- 5. Sticky Bottom Action Buttons & Banner -->
                    <div class="mt-auto">
                        <!-- Split Buttons (Top: Account & Share, Bottom: Wreath) -->
                        <div class="grid grid-cols-2 text-xs font-bold text-slate-800 border-t border-amber-200/50">
                            <button onclick="showAccountModal()" class="bg-[#fcd34d] hover:bg-amber-400 py-3 flex items-center justify-center gap-1.5 transition border-r border-amber-300/60">
                                <i data-lucide="wallet" class="w-4 h-4"></i>
                                부의금
                            </button>
                            <button onclick="shareKakao()" class="bg-white hover:bg-slate-50 py-3 flex items-center justify-center gap-1.5 transition">
                                <i data-lucide="share-2" class="w-4 h-4 text-slate-700"></i>
                                부고전달
                            </button>
                        </div>
                        <button onclick="alert('스마트화환 신청 페이지로 이동합니다.')" class="w-full bg-gradient-to-r from-amber-400 via-amber-500 to-amber-600 hover:from-amber-500 hover:to-amber-700 text-white font-bold py-3 text-xs flex items-center justify-center gap-1.5 shadow-inner transition">
                            <i data-lucide="flower-2" class="w-4 h-4"></i>
                            스마트화환
                        </button>

                        <!-- Bottom Red/Orange Notice Banner -->
                        <div class="bg-[#ea580c] text-white text-center py-2.5 px-3 text-xs font-bold tracking-wide">
                            <span id="previewNotice">본 빈소는 스마트화환만 받습니다</span>
                        </div>
                    </div>

                </div>
            </div>
        </section>

    </main>

    <!-- Account Modal -->
    <div id="accountModal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl max-w-sm w-full p-6 shadow-xl text-center space-y-4">
            <h3 class="text-lg font-bold text-slate-900 font-serif-kr">부의금 전달 계좌</h3>
            <p id="modalAccountText" class="text-sm bg-slate-50 p-3 rounded-lg border text-slate-700 font-mono break-all"></p>
            <div class="flex gap-2">
                <button onclick="copyAccount()" class="flex-1 bg-amber-600 text-white py-2.5 rounded-xl font-medium text-sm hover:bg-amber-700 transition">계좌번호 복사</button>
                <button onclick="closeAccountModal()" class="flex-1 bg-slate-200 text-slate-700 py-2.5 rounded-xl font-medium text-sm hover:bg-slate-300 transition">닫기</button>
            </div>
        </div>
    </div>

    <!-- Script Section -->
    <script>
        // Initialize Lucide Icons
        lucide.createIcons();

        // Elements Mapping
        const inputs = {
            hallName: document.getElementById('inputHallName'),
            deceasedName: document.getElementById('inputDeceasedName'),
            age: document.getElementById('inputAge'),
            gender: document.getElementById('inputGender'),
            photo: document.getElementById('inputPhoto'),
            mourner: document.getElementById('inputMourner'),
            balinDate: document.getElementById('inputBalinDate'),
            balinTime: document.getElementById('inputBalinTime'),
            account: document.getElementById('inputAccount'),
            notice: document.getElementById('inputNotice')
        };

        const previews = {
            hallName: document.getElementById('previewHallName'),
            deceasedName: document.getElementById('previewDeceasedName'),
            age: document.getElementById('previewAge'),
            gender: document.getElementById('previewGender'),
            photo: document.getElementById('previewPhoto'),
            mourner: document.getElementById('previewMourner'),
            balinFull: document.getElementById('previewBalinFull'),
            dday: document.getElementById('previewDday'),
            notice: document.getElementById('previewNotice')
        };

        // Real-time Update Handler
        function updatePreview() {
            previews.hallName.textContent = inputs.hallName.value || '장례식장';
            previews.deceasedName.textContent = inputs.deceasedName.value || '고인명';
            previews.age.textContent = inputs.age.value || '0';
            previews.gender.textContent = inputs.gender.value;
            previews.mourner.textContent = inputs.mourner.value || '상주 정보';
            previews.notice.textContent = inputs.notice.value || '마음 전하실 곳';

            // Date Formatting and D-Day Calculation
            if (inputs.balinDate.value) {
                const dateObj = new Date(inputs.balinDate.value + 'T' + (inputs.balinTime.value || '00:00'));
                const days = ['일', '월', '화', '수', '목', '금', '토'];
                const year = dateObj.getFullYear();
                const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                const date = String(dateObj.getDate()).padStart(2, '0');
                const dayName = days[dateObj.getDay()];
                const hours = String(dateObj.getHours()).padStart(2, '0');
                const minutes = String(dateObj.getMinutes()).padStart(2, '0');

                previews.balinFull.textContent = `${year}년 ${month}월 ${date}일(${dayName}) ${hours}시 ${minutes}분`;

                // Calculate Days Left
                const today = new Date();
                today.setHours(0, 0, 0, 0);
                const targetDay = new Date(inputs.balinDate.value);
                targetDay.setHours(0, 0, 0, 0);
                
                const diffTime = targetDay - today;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));

                if (diffDays > 0) {
                    previews.dday.textContent = `발인까지 ${diffDays}일 남았습니다`;
                } else if (diffDays === 0) {
                    previews.dday.textContent = `오늘 발인입니다`;
                } else {
                    previews.dday.textContent = `발인이 완료되었습니다`;
                }
            }
        }

        // Handle Photo Upload
        inputs.photo.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    previews.photo.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });

        // Add Input Listeners
        Object.values(inputs).forEach(input => {
            if (input) {
                input.addEventListener('input', updatePreview);
            }
        });

        // Modal Controls
        function showAccountModal() {
            document.getElementById('modalAccountText').textContent = inputs.account.value;
            document.getElementById('accountModal').classList.remove('hidden');
        }

        function closeAccountModal() {
            document.getElementById('accountModal').classList.add('hidden');
        }

        function copyAccount() {
            navigator.clipboard.writeText(inputs.account.value);
            alert('계좌번호가 복사되었습니다.');
            closeAccountModal();
        }

        // Sharing Handlers
        function shareKakao() {
            const text = `[부고]\n故 ${inputs.deceasedName.value}님께서 별세하셨기에 알립니다.\n\n- 장례식장: ${inputs.hallName.value}\n- 발인: ${previews.balinFull.textContent}\n- 상주: ${inputs.mourner.value}`;
            navigator.clipboard.writeText(text);
            alert('부고 문구가 복사되었습니다. 원하시는 메시지창에 붙여넣기 하여 전달하세요.');
        }

        function copySMS() {
            shareKakao();
        }

        // Download Preview as Image
        function downloadPreview() {
            const target = document.getElementById('mobilePreview');
            html2canvas(target, { scale: 2 }).then(canvas => {
                const link = document.createElement('a');
                link.download = `부고장_${inputs.deceasedName.value}.png`;
                link.href = canvas.toDataURL();
                link.click();
            });
        }

        // Initial Run
        updatePreview();
    </script>
</body>
</html>
